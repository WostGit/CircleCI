version: 2.1

jobs:
  benchmark-qwen2-mlx:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium

    environment:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - checkout

      - run:
          name: Show machine info
          command: |
            sw_vers
            uname -a
            sysctl -n machdep.cpu.brand_string || true
            sysctl -n hw.memsize || true
            xcodebuild -version
            which python3 || true
            python3 --version || true

      - run:
          name: Ensure Python 3.12
          command: |
            if command -v python3 >/dev/null 2>&1; then
              PYV="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' || echo 0.0)"
            else
              PYV="0.0"
            fi

            case "$PYV" in
              3.1[0-9]|3.[2-9][0-9])
                echo "Using existing python3 ($PYV)"
                ;;
              *)
                brew install python@3.12
                echo 'export PATH="/opt/homebrew/opt/python@3.12/bin:$PATH"' >> "$BASH_ENV"
                source "$BASH_ENV"
                python3 --version
                ;;
            esac

      - run:
          name: Install MLX-LM
          command: |
            python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install mlx-lm

      - run:
          name: Benchmark Qwen2 0.5B tokens per second
          command: |
            source .venv/bin/activate
            mkdir -p artifacts
            python -c '
            import json
            import platform
            import statistics
            import time
            from mlx_lm import load, generate

            MODEL_ID = "mlx-community/Qwen2-0.5B-Instruct"
            WARMUP_TOKENS = 16
            MEASURED_TOKENS = 128
            RUNS = 3

            messages = [
                {"role": "system", "content": "You are a concise assistant."},
                {"role": "user", "content": "Write a short explanation of why matrix multiplication is useful in machine learning."},
            ]

            print("=== Environment ===")
            print(f"platform: {platform.platform()}")
            print(f"machine: {platform.machine()}")
            print(f"processor: {platform.processor()}\n")
            print(f"=== Loading model: {MODEL_ID} ===")

            load_t0 = time.perf_counter()
            model, tokenizer = load(MODEL_ID)
            load_s = time.perf_counter() - load_t0

            prompt = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)
            prompt_tokens = len(tokenizer.encode(prompt))

            print(f"model_load_sec: {load_s:.3f}")
            print(f"prompt_tokens: {prompt_tokens}\n")

            print("=== Warmup ===")
            _ = generate(model, tokenizer, prompt=prompt, max_tokens=WARMUP_TOKENS, verbose=False)
            print(f"warmup_tokens: {WARMUP_TOKENS}\n")

            results = []
            for i in range(RUNS):
                t0 = time.perf_counter()
                text = generate(model, tokenizer, prompt=prompt, max_tokens=MEASURED_TOKENS, verbose=False)
                dt = time.perf_counter() - t0
                output_tokens = len(tokenizer.encode(text))
                tok_s = output_tokens / dt if dt > 0 else 0.0

                result = {
                    "run": i + 1,
                    "elapsed_sec": dt,
                    "output_tokens": output_tokens,
                    "tokens_per_sec": tok_s,
                    "preview": text[:200],
                }
                results.append(result)
                print(f"=== Run {i + 1} ===\n{json.dumps(result, indent=2)}\n")

            tps_values = [r["tokens_per_sec"] for r in results]
            summary = {
                "model": MODEL_ID,
                "median_tokens_per_sec": statistics.median(tps_values),
                "mean_tokens_per_sec": statistics.mean(tps_values),
                "load_sec": load_s,
                "results": results
            }

            with open("artifacts/qwen2-mlx-tps.json", "w") as f:
                json.dump(summary, f, indent=2)

            print("=== Summary ===")
            print(json.dumps(summary, indent=2))
            ' | tee artifacts/qwen2-mlx-tps.txt

      - store_artifacts:
          path: artifacts
          destination: qwen2-mlx-benchmark

workflows:
  version: 2
  qwen2-mlx-benchmark:
    jobs:
      - benchmark-qwen2-mlx
