version: 2.1

jobs:
  benchmark-mlx:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium

    environment:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - checkout

      - run:
          name: Show machine info
          command: |
            sw_vers
            uname -a
            sysctl -n machdep.cpu.brand_string || true
            sysctl -n hw.memsize || true
            xcodebuild -version
            which brew || true
            which python3 || true
            python3 --version || true

      - run:
          name: Ensure Python 3.12
          command: |
            if command -v python3 >/dev/null 2>&1; then
              PYV="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' || echo 0.0)"
            else
              PYV="0.0"
            fi

            case "$PYV" in
              3.1[0-9]|3.[2-9][0-9])
                echo "Using existing python3 ($PYV)"
                ;;
              *)
                brew install python@3.12
                echo 'export PATH="/opt/homebrew/opt/python@3.12/bin:$PATH"' >> "$BASH_ENV"
                source "$BASH_ENV"
                python3 --version
                ;;
            esac

      - run:
          name: Install MLX
          command: |
            python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install mlx numpy

      - run:
          name: Run MLX benchmark
          command: |
            source .venv/bin/activate
            mkdir -p artifacts
            python -c '
            import json
            import platform
            import statistics
            import time
            import mlx.core as mx

            def bench_matmul(n, dtype=mx.float16, warmup=3, runs=10):
                a = mx.random.uniform(shape=(n, n), low=-1.0, high=1.0).astype(dtype)
                b = mx.random.uniform(shape=(n, n), low=-1.0, high=1.0).astype(dtype)

                for _ in range(warmup):
                    c = a @ b
                    mx.eval(c)

                times = []
                checksum = None

                for _ in range(runs):
                    t0 = time.perf_counter()
                    c = a @ b
                    mx.eval(c)
                    checksum = float(c[0, 0].item())
                    times.append(time.perf_counter() - t0)

                median_s = statistics.median(times)
                mean_s = statistics.mean(times)
                tflops = (2 * (n ** 3)) / median_s / 1e12

                return {
                    "size": n,
                    "dtype": str(dtype),
                    "warmup_runs": warmup,
                    "measured_runs": runs,
                    "times_sec": times,
                    "median_sec": median_s,
                    "mean_sec": mean_s,
                    "estimated_tflops_median": tflops,
                    "checksum": checksum,
                }

            print("=== Environment ===")
            print(f"platform: {platform.platform()}")
            print(f"machine: {platform.machine()}")
            print(f"processor: {platform.processor()}")

            print("\\n=== MLX sanity check ===")
            x = mx.array([1.0, 2.0, 3.0])
            mx.eval(x)
            print(f"array: {x}")

            sizes = [2048, 4096, 6144]
            results = []

            for n in sizes:
                print(f"\\n=== Benchmark {n}x{n} float16 matmul ===")
                r = bench_matmul(n)
                results.append(r)
                print(json.dumps(r, indent=2))

            summary = {
                "benchmarks": results,
                "best_tflops_median": max(r["estimated_tflops_median"] for r in results),
            }

            with open("artifacts/mlx-summary.json", "w") as f:
                json.dump(summary, f, indent=2)

            print("\\n=== Summary ===")
            print(json.dumps(summary, indent=2))
            ' | tee artifacts/mlx-benchmark.txt

      - store_artifacts:
          path: artifacts
          destination: mlx-benchmark

workflows:
  mlx-benchmark:
    jobs:
      - benchmark-mlx
